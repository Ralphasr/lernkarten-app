[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lernkarten-app"
version = "1.0.0"
description = "Terminal-Lernkarten-App mit validierter Speicherung und adaptivem Lernmodus"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ralph Asare" }]
dependencies = [
    "pydantic>=2.7,<3",
    "rich>=13.7,<15",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100,<7",
    "interrogate>=1.7,<2",
    "mypy>=1.10,<2",
    "pytest>=8.2,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.5,<1",
]

[project.scripts]
lernkarten = "lernkarten.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lernkarten"]

[tool.pytest.ini_options]
addopts = "--doctest-modules --cov=lernkarten --cov-report=term-missing"
pythonpath = ["src"]
testpaths = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["lernkarten"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.interrogate]
fail-under = 80
exclude = ["tests", "docs"]
ignore-init-method = false
ignore-init-module = false
ignore-module = false
ignore-nested-functions = false
ignore-private = false
ignore-property-decorators = false
verbose = 1

